name: Build & Release App

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-version:
    name: Bump Version & Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bump and synchronize version
        id: bump_step
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.bump != 'none'
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_TAG=$(npm version "$INPUT_BUMP" --no-git-tag-version)
          VERSION=${NEW_TAG#v}
          export VERSION

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          cargo_toml = Path("src-tauri/Cargo.toml")
          text = cargo_toml.read_text()
          text, count = re.subn(
              r'(?m)^(\[package\]\n(?:.*\n)*?version = ")[^"]+("$)',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Failed to synchronize src-tauri/Cargo.toml version")
          cargo_toml.write_text(text)

          tauri_conf = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri_conf.read_text())
          data["version"] = version
          tauri_conf.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          cargo_lock = Path("src-tauri/Cargo.lock")
          lock = cargo_lock.read_text()
          lock, count = re.subn(
              r'(\[\[package\]\]\nname = "aura"\nversion = ")[^"]+("\n)',
              rf'\g<1>{version}\2',
              lock,
              count=1,
          )
          if count != 1:
              raise SystemExit("Failed to synchronize src-tauri/Cargo.lock version")
          cargo_lock.write_text(lock)
          PY

          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin HEAD "v${VERSION}"

      - name: Resolve Version and Tag
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "$TAG" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target version is $VERSION (tag: $TAG)"

  build-and-release:
    name: Build (${{ matrix.platform }})
    needs: prepare-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-arm64
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - os: macos-latest
            platform: mac-x64
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - os: windows-latest
            platform: win-x64
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu --bundles appimage,deb'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          ref: ${{ needs.prepare-version.outputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Import stable macOS signing identity
        if: runner.os == 'macOS'
        env:
          AURA_MACOS_CERT_P12: ${{ secrets.AURA_MACOS_CERT_P12 }}
          AURA_MACOS_CERT_PASSWORD: ${{ secrets.AURA_MACOS_CERT_PASSWORD }}
          AURA_SIGNING_IDENTITY: Aura Local Code Signing
        run: bash scripts/macos/import-signing-identity.sh

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        with:
          tagName: ${{ needs.prepare-version.outputs.tag_name || github.ref_name }}
          releaseName: 'Aura v__VERSION__'
          releaseBody: 'See release notes and assets below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify stable macOS signing identity
        if: runner.os == 'macOS'
        env:
          AURA_SIGNING_IDENTITY: Aura Local Code Signing
          AURA_BUNDLE_ID: com.xrsec.aura
        run: bash scripts/macos/verify-signature.sh "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Aura.app"
